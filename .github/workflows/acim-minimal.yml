name: ACiM Minimal Native Build

on:
  pull_request:
    paths:
      - examples/acim-minimal/**
      - .github/actions/setup-native/**
      - .github/workflows/acim-minimal.yml
  push:
    branches:
      - main
    paths:
      - examples/acim-minimal/**
      - .github/actions/setup-native/**
      - .github/workflows/acim-minimal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-toolchains:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            cc: gcc
            cxx: g++
            sanitizers: OFF
          - name: Clang Debug
            cc: clang
            cxx: clang++
            sanitizers: OFF
          - name: Clang ASan and UBSan
            cc: clang
            cxx: clang++
            sanitizers: ON
    defaults:
      run:
        working-directory: examples/acim-minimal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up native toolchain
        uses: ./.github/actions/setup-native
        with:
          apt-packages: gcc g++ clang

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build/ci-${{ matrix.cc }}-${{ matrix.sanitizers }} -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DACIM_WARNINGS_AS_ERRORS=ON
          -DACIM_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build/ci-${{ matrix.cc }}-${{ matrix.sanitizers }} --parallel

      - name: Test
        run: >-
          ctest --test-dir build/ci-${{ matrix.cc }}-${{ matrix.sanitizers }}
          --output-on-failure

      - name: Install package
        if: matrix.sanitizers == 'OFF'
        run: >-
          cmake --install build/ci-${{ matrix.cc }}-${{ matrix.sanitizers }}
          --prefix build/stage-${{ matrix.cc }}-${{ matrix.sanitizers }}

      - name: Build downstream package consumer
        if: matrix.sanitizers == 'OFF'
        run: |
          cmake -S tests/package-consumer -B build/consumer-${{ matrix.cc }}-${{ matrix.sanitizers }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/stage-${{ matrix.cc }}-${{ matrix.sanitizers }}"
          cmake --build build/consumer-${{ matrix.cc }}-${{ matrix.sanitizers }} --parallel
          ./build/consumer-${{ matrix.cc }}-${{ matrix.sanitizers }}/acim_package_consumer
          ./build/consumer-${{ matrix.cc }}-${{ matrix.sanitizers }}/acim_device_trace_c_consumer

      - name: Run staged smoke
        if: matrix.sanitizers == 'OFF'
        run: ./build/stage-${{ matrix.cc }}-${{ matrix.sanitizers }}/bin/acim_smoke-debug

  windows-msvc:
    name: MSVC Debug
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/acim-minimal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC and native tools
        uses: ./.github/actions/setup-native

      - name: Configure
        run: cmake --preset msvc -DACIM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset msvc --parallel

      - name: Test
        run: ctest --preset msvc

      - name: Install package
        run: cmake --install build/msvc --prefix build/stage-msvc

      - name: Build downstream package consumer
        run: |
          cmake -S tests/package-consumer -B build/consumer-msvc -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_PREFIX_PATH="$PWD/build/stage-msvc"
          cmake --build build/consumer-msvc --parallel
          .\build\consumer-msvc\acim_package_consumer.exe
          .\build\consumer-msvc\acim_device_trace_c_consumer.exe

      - name: Run staged smoke
        run: .\build\stage-msvc\bin\acim_smoke-debug.exe

      - name: Reject an incompatible installed configuration
        run: |
          cmake `
            -DCONSUMER_SOURCE_DIR="$PWD/tests/package-consumer" `
            -DCONSUMER_BINARY_DIR="$PWD/build/consumer-release-rejected-msvc" `
            -DPACKAGE_PREFIX="$PWD/build/stage-msvc" `
            -P cmake/ExpectPackageConfigureFailure.cmake

      - name: Validate single-config package coexistence
        run: |
          cmake -S . -B build/release-msvc -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DACIM_WARNINGS_AS_ERRORS=ON
          cmake --build build/release-msvc --parallel
          cmake --install build/release-msvc --prefix build/stage-msvc
          cmake -S tests/package-consumer -B build/consumer-release-msvc -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$PWD/build/stage-msvc"
          cmake --build build/consumer-release-msvc --parallel
          .\build\consumer-release-msvc\acim_package_consumer.exe
          .\build\consumer-release-msvc\acim_device_trace_c_consumer.exe
          .\build\stage-msvc\bin\acim_smoke-debug.exe
          .\build\stage-msvc\bin\acim_smoke.exe

      - name: Validate multi-config package consumers
        run: |
          cmake -S . -B build/multi-msvc -G "Ninja Multi-Config" `
            "-DCMAKE_CONFIGURATION_TYPES=Debug;Release" `
            -DBUILD_TESTING=OFF `
            -DACIM_WARNINGS_AS_ERRORS=ON
          cmake --build build/multi-msvc --config Debug --parallel
          cmake --build build/multi-msvc --config Release --parallel
          cmake --install build/multi-msvc --config Debug --prefix build/stage-multi-msvc
          cmake --install build/multi-msvc --config Release --prefix build/stage-multi-msvc
          cmake -S tests/package-consumer -B build/consumer-multi-msvc -G "Ninja Multi-Config" `
            "-DCMAKE_CONFIGURATION_TYPES=Debug;Release" `
            -DCMAKE_PREFIX_PATH="$PWD/build/stage-multi-msvc"
          cmake --build build/consumer-multi-msvc --config Debug --parallel
          .\build\consumer-multi-msvc\Debug\acim_package_consumer.exe
          .\build\consumer-multi-msvc\Debug\acim_device_trace_c_consumer.exe
          cmake --build build/consumer-multi-msvc --config Release --parallel
          .\build\consumer-multi-msvc\Release\acim_package_consumer.exe
          .\build\consumer-multi-msvc\Release\acim_device_trace_c_consumer.exe
          .\build\stage-multi-msvc\bin\acim_smoke-debug.exe
          .\build\stage-multi-msvc\bin\acim_smoke.exe

  google-test:
    name: GoogleTest discovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/acim-minimal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up native toolchain
        uses: ./.github/actions/setup-native

      - name: Configure with pinned GoogleTest
        run: >-
          cmake -S . -B build/ci-gtest -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DACIM_WARNINGS_AS_ERRORS=ON
          -DACIM_ENABLE_GTEST=ON
          -DACIM_FETCH_GTEST=ON

      - name: Build
        run: cmake --build build/ci-gtest --parallel

      - name: Test discovered cases
        run: ctest --test-dir build/ci-gtest --output-on-failure

  tracy-integration:
    name: Pinned Tracy integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/acim-minimal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up native toolchain
        uses: ./.github/actions/setup-native

      - name: Configure with pinned Tracy
        run: >-
          cmake -S . -B build/ci-tracy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DACIM_WARNINGS_AS_ERRORS=ON
          -DACIM_ENABLE_TRACY=ON
          -DACIM_FETCH_TRACY=ON

      - name: Build instrumented binaries
        run: cmake --build build/ci-tracy --parallel

      - name: Test instrumented binaries
        run: ctest --test-dir build/ci-tracy --output-on-failure

      - name: Install instrumented package
        run: cmake --install build/ci-tracy --prefix build/stage-tracy

      - name: Build downstream instrumented package consumer
        run: |
          cmake -S tests/package-consumer -B build/consumer-tracy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/build/stage-tracy"
          cmake --build build/consumer-tracy --parallel
          ./build/consumer-tracy/acim_package_consumer
          ./build/consumer-tracy/acim_device_trace_c_consumer

  fuzzing:
    name: Clang libFuzzer smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/acim-minimal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Clang
        uses: ./.github/actions/setup-native
        with:
          apt-packages: clang

      - name: Configure fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/ci-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF
          -DACIM_WARNINGS_AS_ERRORS=ON
          -DACIM_ENABLE_SANITIZERS=ON
          -DACIM_ENABLE_FUZZING=ON

      - name: Build fuzz targets
        run: >-
          cmake --build build/ci-fuzz --parallel
          --target acim_device_trace_fuzzer acim_trace_correlation_fuzzer

      - name: Fuzz device trace buffer
        run: ./build/ci-fuzz/acim_device_trace_fuzzer -max_total_time=20 -timeout=5

      - name: Fuzz clock correlation
        run: ./build/ci-fuzz/acim_trace_correlation_fuzzer -max_total_time=20 -timeout=5

  static-analysis:
    name: clang-format and clang-tidy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/acim-minimal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Clang tools
        uses: ./.github/actions/setup-native
        with:
          apt-packages: clang clang-format clang-tidy

      - name: Check C and C++ formatting
        run: >-
          clang-format --dry-run --Werror
          firmware/include/acim/device_events.h
          firmware/include/acim/device_trace.h
          include/acim/profiling.hpp
          include/acim/simulator.hpp
          include/acim/trace_correlation.hpp
          src/simulator.cpp
          src/trace_correlation.cpp
          apps/acim_smoke.cpp
          tests/simulator_test.cpp
          tests/simulator_gtest.cpp
          tests/device_trace_c_test.c
          tests/profiling_interface_test.cpp
          tests/trace_test.cpp
          tests/package-consumer/main.cpp
          tests/package-consumer/device_trace_c_consumer.c
          tests/ubsan_must_fail.cpp
          fuzz/acim_device_trace_fuzzer.cpp
          fuzz/acim_trace_correlation_fuzzer.cpp

      - name: Configure compilation database
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/ci-tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=ON

      - name: Run clang-tidy
        run: >-
          clang-tidy -p build/ci-tidy
          --warnings-as-errors='*'
          src/simulator.cpp
          src/trace_correlation.cpp
          apps/acim_smoke.cpp
          tests/simulator_test.cpp
          tests/trace_test.cpp
